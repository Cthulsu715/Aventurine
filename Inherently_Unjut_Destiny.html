<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命運從未公平 | 流光定影</title>
    <style>
        /* ========================================= */
        /* 基礎設定                                  */
        /* ========================================= */
        :root {
            --color-gold: #C4A15A;       /* 砂金代表色 */
            --color-bg: #1E1E1E;         /* 深灰底 */
            --color-text: #D4D4D4;       /* 淺灰字 */
            --color-caption-bg: #2B2F33; /* 說明欄背景 */
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========================================= */
        /* 圖片展示區 (Gold Frame)                   */
        /* ========================================= */
        .gallery-container {
            max-width: 906px; /* 限制最大寬度為圖片原寬 */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 讓容器稍微浮起來的陰影 */
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .image-frame {
            /* 設置圖片容器 */
            width: 100%;
            /* 保持 906:1260 的比例，避免圖片未載入時版面跳動 */
            aspect-ratio: 906 / 1260; 
            
            /* 金色邊框設定 */
            border: 4px solid var(--color-gold); 
            /* 內縮一點空間，製造「畫框」的雙層層次感 */
            padding: 10px; 
            background-color: #111; /* 框內深底 */
            
            /* 裝飾：金屬光澤陰影 */
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8), /* 內陰影 */
                0 0 15px rgba(196, 161, 90, 0.3); /* 外發光 */
            
            box-sizing: border-box;
            position: relative;
        }

        /* 實際圖片樣式 */
        .story-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保填滿框框且不變形 */
            display: block;
        }

        /* 金屬角標裝飾 (增加精緻度) */
        .image-frame::before {
            content: ""; position: absolute; top: -2px; left: -2px;
            width: 50px; height: 50px;
            border-top: 4px solid var(--color-gold);
            border-left: 4px solid var(--color-gold);
            z-index: 2;
        }
        .image-frame::after {
            content: ""; position: absolute; bottom: -2px; right: -2px;
            width: 50px; height: 50px;
            border-bottom: 4px solid var(--color-gold);
            border-right: 4px solid var(--color-gold);
            z-index: 2;
        }

        /* ========================================= */
        /* 下方說明欄 (Caption Box)                  */
        /* ========================================= */
        .caption-box {
            width: 100%;
            max-width: 800px; /* 說明欄比圖片稍窄一點，視覺較優雅 */
            margin-top: 30px;
            background-color: var(--color-caption-bg);
            border-top: 2px solid var(--color-gold); /* 頂部金線呼應 */
            padding: 30px 40px;
            box-sizing: border-box;
            text-align: justify; /* 左右對齊 */
            position: relative;
        }

        /* 標題樣式 */
        .caption-title {
            color: var(--color-gold);
            font-size: 1.8em;
            margin: 0 0 15px 0;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center; /* 標題置中 */
        }

        /* 內文樣式 */
        .caption-text {
            line-height: 1.8;
            font-size: 1.1em;
            color: #ccc;
        }

        /* 返回按鈕 (懸浮或置底) */
        .back-link {
            margin-top: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s;
            border-bottom: 1px dashed #666;
        }
        .back-link:hover {
            color: var(--color-gold);
            border-bottom-color: var(--color-gold);
        }

    </style>
</head>
<body>

    <div class="gallery-container">
        
        <div class="image-frame">
            <img src="images/Inherently_Unjust_Destiny.jpg" alt="命運從未公平" class="story-image">
        </div>

        <div class="caption-box">
            <h1 class="caption-title">命運從未公平</h1>
            <div class="caption-text">
                <p>
                    【最後一張牌攤開，沮喪，憤怒，無奈，鎮靜，百千種情緒瞬間浮現於對手們的臉。】
                </p>
                <p>
                    「來都來了，何不再刺激一點？」 他押上所有籌碼，自認倒霉者咒罵著退出，暗自期待他的大敗。

                    輸贏、聲名、運氣……他並不在意，他只是痴迷於那令生命顫抖的時刻—— 在深淵與天堂之間，只有一個選擇的距離。

                    籌碼擲下，哀嘆聲起，如這般虛幻的滿足在塵埃落定後轉瞬即逝。
                <p>
                    「所有，或一無所有，但我並無選擇的自由…………」
                </p>
            </div>
        </div>

        <a href="Index.html" class="back-link">← 返回首頁 (RETURN)</a>

    </div>

</body>
</html>
